# ─────────────────────────────────────────────────────────────────────────────
# EquipShare — Build & Deploy Back-End to Azure Container Apps (Free Tier)
#
# Triggers on: push to back-end branch, or manual workflow_dispatch
#
# Steps:
#   1. Build Docker image and push to GitHub Container Registry (free)
#   2. Create Azure resource group (idempotent)
#   3. Deploy infrastructure via Bicep (Cosmos DB + Container Apps)
#   4. Container App is updated with the new image
# ─────────────────────────────────────────────────────────────────────────────

name: Build and Deploy Back-End

on:
  push:
    branches: [back-end]
    paths:
      - "EquipShareBk/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# ── Global environment ────────────────────────────────────────────────────────
env:
  AZURE_RG: rg-equipshare
  LOCATION: eastus
  APP_NAME: equipshare
  IMAGE_NAME: ghcr.io/ibshaya/equipshare # Must be lowercase

permissions:
  contents: read
  packages: write # Required to push to ghcr.io

jobs:
  # ╭──────────────────────────────────────────╮
  # │  1. Build & Push Docker Image            │
  # ╰──────────────────────────────────────────╯
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: EquipShareBk                          # source code build context
          file: EquipShareBk/infra/Dockerfile            # Dockerfile grouped under infra/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ╭──────────────────────────────────────────╮
  # │  2. Deploy Infrastructure + App (Bicep)  │
  # ╰──────────────────────────────────────────╯
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name     ${{ env.AZURE_RG }} \
            --location ${{ env.LOCATION }}

      # Use jq to safely encode secrets into a JSON parameters file.
      # This handles special characters (=, @, /) in connection strings.
      - name: Build Bicep parameters file
        env:
          _JWT: ${{ secrets.JWT_ACCESS_SECRET }}
          _SMTP_U: ${{ secrets.SMTP_USER }}
          _SMTP_P: ${{ secrets.SMTP_PASS }}
          _STORAGE: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          _STRIPE: ${{ secrets.STRIPE_SECRET_KEY }}
          _FRONTEND: ${{ secrets.FRONTEND_URL }}
        run: |
          jq -n \
            --arg appName      "${{ env.APP_NAME }}" \
            --arg image        "${{ env.IMAGE_NAME }}:latest" \
            --arg jwt          "$_JWT" \
            --arg frontend     "$_FRONTEND" \
            --arg smtpUser     "$_SMTP_U" \
            --arg smtpPass     "$_SMTP_P" \
            --arg storage      "$_STORAGE" \
            --arg stripe       "$_STRIPE" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                "appName":                       { "value": $appName   },
                "containerImage":                { "value": $image     },
                "jwtAccessSecret":               { "value": $jwt       },
                "frontendUrl":                   { "value": $frontend  },
                "smtpUser":                      { "value": $smtpUser  },
                "smtpPass":                      { "value": $smtpPass  },
                "azureStorageConnectionString":  { "value": $storage   },
                "stripeSecretKey":               { "value": $stripe    }
              }
            }' > /tmp/params.json

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RG }} \
            --template-file  EquipShareBk/infra/main.bicep \
            --parameters     @/tmp/params.json \
            --output         json \
          | jq '.properties.outputs | to_entries[] | "\(.key): \(.value.value)"'

      - name: Azure logout
        if: always()
        run: az logout
