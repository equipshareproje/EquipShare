# ─────────────────────────────────────────────────────────────────────────────
# EquipShare — Build & Deploy Front-End to Azure Static Web Apps (Free Tier)
#
# Triggers on: push to main (frontend paths), or manual workflow_dispatch
#
# Steps:
#   1. Login to Azure and ensure the resource group exists
#   2. Deploy Bicep template to create/update the Static Web App resource
#   3. Retrieve the deployment API key securely via az CLI
#   4. Build the React app and upload it to Azure Static Web Apps
# ─────────────────────────────────────────────────────────────────────────────

name: Build and Deploy Front-End

on:
  push:
    branches: [main]
    paths:
      - "EquipShareFr/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# ── Global environment ────────────────────────────────────────────────────────
env:
  AZURE_RG: rg-equipshare
  LOCATION: eastus2
  APP_NAME: equipshare

permissions:
  contents: read

jobs:
  # ╭──────────────────────────────────────────────────╮
  # │  Deploy Infrastructure + Build & Upload Front-End │
  # ╰──────────────────────────────────────────────────╯
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name     ${{ env.AZURE_RG }} \
            --location ${{ env.LOCATION }}

      # Use jq to safely encode the API URL parameter
      - name: Build Bicep parameters file
        run: |
          jq -n \
            --arg appName "${{ env.APP_NAME }}" \
            --arg apiUrl  "${{ secrets.BACKEND_URL }}" \
            '{
              "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              "contentVersion": "1.0.0.0",
              "parameters": {
                "appName": { "value": $appName },
                "apiUrl":  { "value": $apiUrl  }
              }
            }' > /tmp/params.json

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RG }} \
            --template-file  EquipShareFr/infra/main.bicep \
            --parameters     @/tmp/params.json \
            --output         json \
          | jq '.properties.outputs | to_entries[] | "\(.key): \(.value.value)"'

      # Retrieve and mask the Static Web App deployment API key
      - name: Get Static Web App deployment token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name           "${{ env.APP_NAME }}-web" \
            --resource-group "${{ env.AZURE_RG }}" \
            --query          "properties.apiKey" \
            --output         tsv)
          echo "::add-mask::$TOKEN"
          echo "deployment_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Build and Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: EquipShareFr # React source root (relative to repo root)
          output_location: build # npm run build output folder
          app_build_command: npm run build

      - name: Azure logout
        if: always()
        run: az logout
